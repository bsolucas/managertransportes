<!DOCTYPE html>
<!-- =============================================================================
     paginas/cliente.html — PORTAL DO CLIENTE
     -----------------------------------------------------------------------------
     Duas abas:
       • Pedir corrida ..... informa embarque, destino e tipo de veículo. O cliente NÃO escolhe
                             trajeto e NÃO vê preço: o gestor define o valor de cada corrida,
                             olhando o destino (banco/28)
       • Minhas corridas ... acompanha o motorista no mapa e conversa no chat
     O comportamento está em js/paginas/cliente.js.
     ============================================================================= -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cliente — Manager Transportes</title>

  <!-- PWA: deixa o app instalável no celular (Android/iPhone) -->
  <link rel="manifest" href="../manifest.json" />
  <meta name="theme-color" content="#3b6fd6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Manager" />
  <link rel="icon" type="image/png" href="../icones/icone-192.png" />
  <link rel="apple-touch-icon" href="../icones/apple-touch-icon.png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/componentes.css" />
  <link rel="stylesheet" href="../css/mapa.css" />
  <link rel="stylesheet" href="../css/paginas/cliente.css" />
  <link rel="stylesheet" href="../css/responsivo.css" /> <!-- ajustes de celular: sempre por último -->
</head>
<body>

  <!-- ======================= TOPO ======================= -->
  <header class="topo">
    <div class="marca"><span class="marca-icone">M</span><span id="nome-app" class="oculto-celular">Manager Transportes</span></div>
    <span class="topo-perfil">Portal do cliente</span>
    <div class="topo-espaco"></div>
    <div class="topo-usuario">
      <span class="avatar" id="usuario-avatar">C</span>
      <span id="usuario-nome" class="oculto-celular">Cliente</span>
      <button class="botao botao-secundario botao-pequeno" id="botao-sair">Sair</button>
    </div>
  </header>

  <!-- ======================= ABAS ======================= -->
  <nav class="abas-topo" aria-label="Seções do portal">
    <button class="aba ativo" data-aba="pedir">Pedir corrida</button>
    <button class="aba" data-aba="minhas">Minhas corridas <span class="contador-nao-lidas" id="contador-cliente" hidden>0</span></button>
  </nav>

  <main class="conteudo">

    <!-- ===================== ABA: PEDIR CORRIDA ===================== -->
    <section data-painel="pedir">
      <div class="coluna-pedido">
        <form class="cartao cartao-pedido" id="formulario-pedido" autocomplete="off">
          <h2>Para onde vamos?</h2>

          <!-- 2. De onde sai e para onde vai (as duas linhas ficam ligadas por um traço, como num mapa) -->
          <div class="grupo-campo">
            <span class="rotulo-secao"><b>1</b> De onde sai e para onde vai</span>
            <div class="caixa-rota">
              <div class="linha-rota">
                <span class="ponto ponto-origem" aria-hidden="true"></span>
                <input class="campo-rota" id="pedido-embarque" maxlength="200" placeholder="Endereço de embarque" aria-label="Endereço de embarque (de onde sair)" />
                <button type="button" class="botao-gps" id="usar-localizacao"></button>
              </div>
              <div class="linha-rota">
                <span class="ponto ponto-destino" aria-hidden="true"></span>
                <input class="campo-rota" id="pedido-destino" maxlength="200" placeholder="Endereço de destino" aria-label="Endereço de destino" />
              </div>
            </div>
            <small class="dica-campo" id="dica-localizacao" hidden></small>
          </div>

          <!-- 3. Tipo de veículo -->
          <div class="grupo-campo">
            <span class="rotulo-secao"><b>2</b> Tipo de veículo</span>
            <div class="grade-servicos" id="pedido-servicos" role="radiogroup" aria-label="Tipo de veículo"></div>
          </div>

          <details class="obs-pedido">
            <summary>Adicionar observação</summary>
            <textarea class="campo" id="pedido-observacoes" maxlength="300" placeholder="Ex.: veículo não liga, precisa de plataforma; levar 2 malas..."></textarea>
          </details>

          <!-- Barra de baixo: valor + botão (fica visível enquanto se rola o formulário) -->
          <div class="barra-pedido">
            <div class="previa-preco" id="previa-preco"></div>
            <p class="texto-suave texto-pequeno" id="aviso-modo-pedido"></p>
            <button class="botao botao-primario botao-largo botao-grande" type="submit" id="botao-pedir">Solicitar corrida</button>
          </div>
        </form>
      </div>
    </section>

    <!-- ===================== ABA: MINHAS CORRIDAS ===================== -->
    <section data-painel="minhas" hidden>
      <div class="grade-minhas">

        <!-- Lista das corridas do cliente -->
        <div class="cartao">
          <h2>Minhas corridas</h2>
          <button class="botao botao-secundario botao-pequeno" id="remover-canceladas" hidden></button>
          <div class="lista-corridas lista-rolavel" id="lista-minhas"></div>
        </div>

        <!-- Acompanhamento da corrida selecionada -->
        <div class="pilha">
          <div class="cartao" id="acompanhamento"></div>
          <div class="cartao">
            <div class="mapa" id="mapa-acompanhar"></div>
            <p class="texto-suave texto-pequeno" id="aviso-mapa">O motorista aparece no mapa quando aceitar a corrida e ligar o GPS.</p>
          </div>
        </div>

        <!-- Chat da corrida selecionada -->
        <div id="chat-cliente"></div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- Biblioteca do Supabase (login e dados do cliente) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/icones.js"></script>
  <script src="../js/utilitarios.js"></script>
  <script src="../js/dados-teste.js"></script>
  <script src="../js/precos.js"></script>
  <script src="../js/sessao.js"></script>
  <script src="../js/interface.js"></script>
  <script src="../js/config-supabase.js"></script>
  <script src="../js/auth-supabase.js"></script>
  <script src="../js/enderecos.js"></script>
  <script src="../js/rastreio.js"></script>
  <script src="../js/config-firebase.js"></script>
  <script src="../js/push.js"></script>
  <script src="../js/notificacoes.js"></script>
  <script src="../js/nuvem.js"></script>
  <script src="../js/config-mapa.js"></script>
  <script src="../js/mapa-google.js"></script>
  <script src="../js/mapa.js"></script>
  <script src="../js/chat.js"></script>
  <script src="../js/paginas/cliente.js"></script>

  <!-- PWA: registra o service worker -->
  <script src="../js/pwa.js"></script>
</body>
</html>
